{% load static %}<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b2540">
    <meta name="description" content="Sistema de Atención y Gestión de Reclamos de la Junta de Saneamiento de Bella Vista - Itapúa.">
    <title>{% block titulo %}Sistema de Reclamos{% endblock %} · Junta de Saneamiento de Bella Vista</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'reclamos_app/img/logo.svg' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="{% static 'reclamos_app/css/estilos.css' %}" rel="stylesheet">
</head>
<body class="{% block clase_body %}{% endblock %}">
    {% block cuerpo %}{% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.querySelectorAll('[data-ver-contrasenha]').forEach(function (boton) {
            boton.addEventListener('click', function () {
                var campo = boton.parentElement.querySelector('input');
                var visible = campo.type === 'text';
                campo.type = visible ? 'password' : 'text';
                boton.querySelector('i').className = visible ? 'bi bi-eye' : 'bi bi-eye-slash';
                boton.setAttribute('aria-label', visible ? 'Mostrar contraseña' : 'Ocultar contraseña');
            });
        });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
