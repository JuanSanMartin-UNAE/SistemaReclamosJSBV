{% extends 'reclamos_app/autenticacion/base_autenticacion.html' %}

{% block titulo %}Contraseña actualizada{% endblock %}

{% block contenido %}
<div class="text-center">
    <span class="auth-icono text-success"><i class="bi bi-check-circle"></i></span>
    <h1 class="h3 mb-3">¡Contraseña actualizada!</h1>
    <p class="text-secondary mb-4">Tu contraseña se cambió correctamente. Ya podés iniciar sesión con la nueva contraseña.</p>
    <a href="{% url 'reclamos_app:ingresar' %}" class="btn btn-primary w-100 py-3">
        <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar sesión
    </a>
</div>
{% endblock %}
