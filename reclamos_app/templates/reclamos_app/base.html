<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Gestión de Reclamos{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'reclamos_app:inicio' %}">Gestión de Reclamos</a>
            <div class="navbar-nav">
                <a class="nav-link" href="{% url 'reclamos_app:barrio_lista' %}">Barrios</a>
                <a class="nav-link" href="{% url 'reclamos_app:rol_lista' %}">Roles</a>
                <a class="nav-link" href="{% url 'reclamos_app:usuario_lista' %}">Usuarios</a>
                <a class="nav-link" href="{% url 'admin:index' %}">Admin</a>
            </div>
        </div>
    </nav>

    <main class="container">
        {% for mensaje in messages %}
            <div class="alert alert-{% if mensaje.tags == 'error' %}danger{% else %}{{ mensaje.tags }}{% endif %}">{{ mensaje }}</div>
        {% endfor %}

        {% block contenido %}{% endblock %}
    </main>
</body>
</html>
