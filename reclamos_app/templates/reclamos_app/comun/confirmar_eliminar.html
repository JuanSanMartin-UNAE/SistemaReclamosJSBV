{% extends 'reclamos_app/base.html' %}

{% block titulo %}Eliminar{% endblock %}
{% block titulo_barra %}Eliminar registro{% endblock %}

{% block contenido %}
<div class="tarjeta tarjeta-cuerpo text-center mx-auto" style="max-width: 480px;">
    <span class="auth-icono text-danger" style="background: #fee2e2;"><i class="bi bi-trash3"></i></span>
    <h1 class="h4 mb-2">¿Eliminar este registro?</h1>
    <p class="text-secondary mb-4">Vas a eliminar <strong class="text-body">{{ object }}</strong>. Esta acción no se puede deshacer.</p>
    <form method="post" class="d-flex flex-column flex-sm-row gap-2 justify-content-center">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger"><i class="bi bi-trash3 me-1"></i>Sí, eliminar</button>
        <a href="{{ url_volver }}" class="btn btn-light">Cancelar</a>
    </form>
</div>
{% endblock %}
