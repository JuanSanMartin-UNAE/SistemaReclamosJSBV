{% extends 'reclamos_app/base.html' %}

{% block contenido %}
<h1 class="mb-4">Panel principal</h1>
<div class="row g-3">
    <div class="col-md-4">
        <a class="card text-decoration-none" href="{% url 'reclamos_app:barrio_lista' %}">
            <div class="card-body"><h5>Barrios</h5><p class="display-6 mb-0">{{ total_barrios }}</p></div>
        </a>
    </div>
    <div class="col-md-4">
        <a class="card text-decoration-none" href="{% url 'reclamos_app:rol_lista' %}">
            <div class="card-body"><h5>Roles</h5><p class="display-6 mb-0">{{ total_roles }}</p></div>
        </a>
    </div>
    <div class="col-md-4">
        <a class="card text-decoration-none" href="{% url 'reclamos_app:usuario_lista' %}">
            <div class="card-body"><h5>Usuarios</h5><p class="display-6 mb-0">{{ total_usuarios }}</p></div>
        </a>
    </div>
</div>
{% endblock %}
